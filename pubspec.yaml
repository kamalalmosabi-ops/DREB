name: darb
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # أضف هذا السطر
    sdk: flutter         # وأضف هذا السطر

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.1.2
  intl: 0.20.2
  http_parser: ^4.1.0
  provider: ^6.1.5+1
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.9.0
  firebase_analytics: ^12.4.1
  pinput: ^6.0.2
  url_launcher: ^6.3.0 
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # تعريف وإدراج صور التطبيق
  assets:
    - assets/images/logo.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.jpg
    - assets/lang/

  # تعريف وإدراج خط (تجوال)
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700